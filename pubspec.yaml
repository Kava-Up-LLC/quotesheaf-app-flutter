name: quote_generator_app
description: "Quotesheaf — contractor quotes on AppAmbit."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  appambit_sdk_flutter: ^1.2.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_email_sender: ^9.0.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.5.0
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.20
  path_provider: ^2.1.6
  pdf: ^3.12.0
  pdfrx: ^2.4.7
  riverpod_annotation: ^4.0.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-700.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# App icon: "El total" (logo option 1). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#161616"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
